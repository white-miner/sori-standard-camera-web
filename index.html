<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="/sori-standard-camera-web/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="동일한 기준으로 비교할 수 있는 촬영 기록을 준비하는 도구">
  <meta name="theme-color" content="#FBF9F6">
  <meta name="color-scheme" content="light">
  <title>표준 촬영</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #FBF9F6; }
    #loading { padding: 32px 24px; color: #111; font: 16px/1.6 sans-serif; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">표준 촬영을 여는 중입니다.</div>
  <noscript>표준 촬영을 사용하려면 JavaScript를 켜 주세요.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
